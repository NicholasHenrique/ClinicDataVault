name: 'clinic_datavault'
version: '1.0.0'
config-version: 2

profile: 'clinic_datavault'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  clinic_datavault:
    staging:
      +schema: raw_vault
      +materialized: table
    raw_vault:
      hubs:
        +schema: raw_vault
        +materialized: incremental
      links:
        +schema: raw_vault
        +materialized: incremental
      satellites:
        +schema: raw_vault
        +materialized: incremental
    intermediate:
      +schema: raw_vault
      +materialized: view
